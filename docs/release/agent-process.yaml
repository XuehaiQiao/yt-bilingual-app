# LinguaTrek Release Agent — fixed, context-free process.
# Agent runs ONLY local steps. Production is always a human gate.
version: 3
process: linguatrek-release
owner: Release Owner
inputs_file: /tmp/release-input.yaml

repo:
  root: "{{ repo_root }}"                 # required absolute path from release-input.yaml
  required_files:
    - AGENTS.md
    - backend/venv/bin/python
    - backend/venv/bin/alembic
    - frontend/node_modules
    - scripts/node_modules
    - docs/release/HUMAN_RUNBOOK.md
    - docs/release/agent-report.schema.json

inputs:
  required:
    - version          # vX.Y.Z or vX.Y.Z-rc.N
    - release_sha      # 7-40 hex chars
    - release_type     # code | copy | schema | data | auth_cache | cost_security
    - includes_migration
    - includes_backfill
    - rollback_image
    - repo_root        # absolute path; must contain .git
  optional:
    - production_backup_path
    - migration_rehearsal_command
    - migration_verify_command
    - backfill_dry_run_command
    - backfill_apply_command
    - backfill_audit_command
    - skip_scripts
    - skip_reason
  local:
    local_api: "http://127.0.0.1:8000"
    local_web: "http://127.0.0.1:5173"
  missing_input_policy: STOP_AND_ASK_RELEASE_OWNER
  empty_string_is_missing: true

policy:
  environment: local_only
  production_actions: forbidden
  destructive_actions: forbidden
  secrets: never_print
  stop_on_first_failure: true
  human_gate_before: production_deploy
  tag_and_push: human_only

allowed:
  - read_repo
  - start_local_services_if_absent
  - stop_local_services_it_started
  - run_pytest
  - run_frontend_gates
  - install_local_test_dependencies
  - run_local_acceptance
  - inspect_local_logs
  - run_local_migrations
  - copy_local_backup_to_tmp
  - run_migration_on_tmp_copy
  - write_release_report
forbidden:
  - ssh_or_remote_production
  - docker_compose_up_on_production
  - alembic_upgrade_on_production
  - delete_backups
  - read_production_env_or_credentials
  - change_dns_smtp_provider
  - tag_or_push
  - read_from_srv_ln_backups

bootstrap:
  - command: "test -d \"{{ repo_root }}/.git\""
  - command: "cd \"{{ repo_root }}\" && git fetch origin"
  - command: "cd \"{{ repo_root }}\" && git checkout \"{{ release_sha }}\""
  - command: "cd \"{{ repo_root }}\" && git status --porcelain"
    expect: ""
  - command: "command -v git python3 node npm curl sqlite3"
    fail_if: "missing tool"
  - check_local_service:
      name: api
      url: "{{ local_api }}/healthz"
      if_absent: start_backend
  - check_local_service:
      name: web
      url: "{{ local_web }}/"
      if_absent: start_frontend

phases:
  - id: p0-input
    owner: agent
    steps:
      - action: validate_input
        rules:
          version: '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          release_sha: '^[0-9a-f]{7,40}$'
          release_type: '^(code|copy|schema|data|auth_cache|cost_security)$'
          repo_root: '^/'
          rollback_image: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
      - action: require_inputs
        when: includes_migration == true
        fields: [production_backup_path, migration_rehearsal_command, migration_verify_command, rollback_db_revision]
        non_empty: true
        path_prefix: /tmp/
      - action: require_inputs
        when: includes_backfill == true
        fields: [production_backup_path, migration_verify_command, backfill_dry_run_command, backfill_apply_command, backfill_audit_command, rollback_db_revision]
        non_empty: true
        path_prefix: /tmp/
    fail_if: [missing_input, invalid_input, empty_command]

  - id: p1-repo
    owner: agent
    steps:
      - command: "cd \"{{ repo_root }}\" && git log -1 --oneline"
      - command: "cd \"{{ repo_root }}\" && test \"$(git rev-parse HEAD)\" = \"$(git rev-parse \"{{ release_sha }}\")\""
        expect_exit: 0
      - command: "cd \"{{ repo_root }}\" && git rev-parse --short HEAD"
        record: head_short
    fail_if: [sha_mismatch, dirty_worktree]

  - id: p2-backend
    owner: agent
    cwd: "{{ repo_root }}/backend"
    steps:
      - command: "venv/bin/alembic upgrade head"
        expect_exit: 0
        record: local_migration_applied
      - command: "venv/bin/python -m pytest tests -q"
        expect_exit: 0
        timeout_seconds: 900
        record: pytest_summary
      - command: "venv/bin/python -m compileall -q -x '(^|/)(venv|tests)/' ."
        expect_exit: 0
      - command: "venv/bin/alembic heads"
        expect: single_head
      - command: "venv/bin/alembic current"
        record: local_current
    fail_if: [pytest_failed, compile_failed, multiple_heads]

  - id: p3-frontend
    owner: agent
    cwd: "{{ repo_root }}/frontend"
    steps:
      - command: "npx tsc -b"
        expect_exit: 0
      - command: "npm run build"
        expect_exit: 0
      - command: "npm run check:i18n"
        expect_exit: 0
        record: i18n_summary
    fail_if: [tsc_failed, build_failed, i18n_failed]

  - id: p4-acceptance
    owner: agent
    cwd: "{{ repo_root }}"
    steps:
      - command: "OUT=/tmp/release/{{ version }}-{{ release_sha }}/acceptance SKIP=\"{{ skip_scripts }}\" SKIP_REASON=\"{{ skip_reason }}\" bash scripts/release-acceptance-suite.sh"
        expect_exit: 0
        timeout_seconds: 7200
        record: acceptance_matrix
        artifacts: "/tmp/release/{{ version }}-{{ release_sha }}/acceptance/acceptance.tsv"
    fail_if: [unexplained_failure, silent_skip]
    notes: |
      The suite writes one TSV row per script (PASS/FAIL/TIMEOUT/SKIP).
      For release, SKIP is diagnostic only and forces NO_GO; do not use it
      to bypass a failing harness. Retry-pass is recorded and allowed.

  - id: p5-migration
    owner: agent
    cwd: "{{ repo_root }}"
    when: includes_migration == true or includes_backfill == true
    environment:
      RELEASE_DATA_DIR: /tmp/release-copy
      AUTH_DB_PATH: /tmp/release-copy/app.db
      USER_DATA_DIR: /tmp/release-copy/users
    steps:
      - command: "rm -rf /tmp/release-copy && cp -a \"{{ production_backup_path }}\" /tmp/release-copy"
        expect_exit: 0
        note: production_backup_path must already be a LOCAL copy under /tmp; never /srv/ln/backups
      - command: "{{ migration_rehearsal_command }}"
        when: includes_migration == true
        expect_exit: 0
        record: migration_rehearsal
      - command: "{{ migration_verify_command }}"
        expect_exit: 0
        record: migration_verify
      - command: "{{ backfill_dry_run_command }}"
        when: includes_backfill == true
        expect_exit: 0
        record: backfill_dry_run
      - command: "{{ backfill_apply_command }}"
        when: includes_backfill == true
        expect_exit: 0
        record: backfill_apply
      - command: "{{ backfill_audit_command }}"
        when: includes_backfill == true
        expect_exit: 0
        record: backfill_audit
    fail_if: [rehearsal_fail, verify_fail, backfill_fail, missing_backup, destructive_downgrade]
    if_missing_or_empty: STOP_ASK_RELEASE_OWNER

  - id: p6-report
    owner: agent
    cwd: "{{ repo_root }}"
    steps:
      - action: write_json
        path: "/tmp/release/{{ version }}-{{ release_sha }}/release-report.json"
        schema: docs/release/agent-report.schema.json
      - action: write_markdown
        path: "/tmp/release/{{ version }}-{{ release_sha }}/release-report.md"
      - action: map_acceptance_checks
        rule: "one checks[] entry per scripts/*acceptance*.mjs; id=basename without .mjs; status from acceptance.tsv; evidence=log path; SKIP needs skip_reason"
      - action: set_status
        rule: "GO if every required check is PASS and blockers is empty; otherwise NO_GO"
      - action: human_gate
        before: production_deploy
        message: "Stop here. Human reads HUMAN_RUNBOOK.md and executes production."

cleanup:
  - action: stop_local_services
    only: services_started_by_agent
  - action: keep_artifacts
    paths:
      - "/tmp/release/{{ version }}-{{ release_sha }}"

human_handoff:
  required: true
  before: production_deploy
  owner: Release Owner
  must_review:
    - "/tmp/release/{{ version }}-{{ release_sha }}/release-report.md"
    - "docs/release/templates/version-release-checklist.md"
  production_steps: docs/release/HUMAN_RUNBOOK.md
