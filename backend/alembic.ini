# Alembic 配置（语途 / LinguaTrek 后端）。
#
# 命令都在 backend/ 下执行，例如：
#   venv/bin/alembic upgrade head
#   venv/bin/alembic current
#
# 数据库地址**不写在这里**：migrations/env.py 按下面的优先级决定
#   1) 环境变量 AUTH_DB_PATH（运维/测试显式指定）
#   2) backend/config.py 的 AUTH_DB_PATH（默认 data/app.db）
# 这样迁移命令和运行时用的是同一个路径来源。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# 迁移 id 本身递增（0001_baseline → 0002_learning_events），文件名用 id 便于排序；
# 新增迁移时用：venv/bin/alembic revision -m "说明" --rev-id 0003_xxx
# 注意 Alembic 会自动补 .py，模板里不要再写扩展名。
file_template = %%(rev)s
path_separator = os
timezone = UTC

# sqlalchemy.url 故意留空：env.py 会从 AUTH_DB_PATH / config.py 生成 sqlite URL。
# sqlalchemy.url =


[post_write_hooks]


# 日志配置（只被 env.py 读取；迁移命令把日志打到 stderr）。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
