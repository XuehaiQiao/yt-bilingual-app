# 语途（LinguaTrek）CI：PR/推送时跑后端离线测试与前端类型检查/构建。
#
# - 不需要 secrets：后端测试全程离线（外部调用由 tests/conftest.py monkeypatch）。
# - 后端 job 对应提交门禁：py_compile + pytest；前端对应 tsc -b + vite build。
# - 依赖缓存由 setup-python / setup-node 按 lock 文件管理。

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile *.py

      - name: Test (offline)
        run: python -m pytest tests -q

  frontend:
    name: frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npx vite build

      - name: i18n check
        run: npm run check:i18n

  # W5b 扫描（report-only）。基线见
  # docs/design-governance/reports/ui-baseline-2026-11-19.md。
  # 故意不接 --fail：存量基线（约 846 行 token 命中）远未清零，接阻断会必红；
  # 按 design-gate.md §4.3 的节奏，先本地绿 → CI 只报告 → 清理后再阻断。
  # `|| true` 只用于「不阻断」，扫描失败/脚本报错仍会留在日志里供排查。
  design-scan:
    name: design scan (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Token scan (report only)
        run: node scripts/check-design-tokens.mjs --baseline || true

      - name: Selector scan (report only)
        run: node scripts/check-ui-selectors.mjs --baseline || true
